services:
  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://digital_learning:digital_learning_dev@postgres:5432/digital_learning?schema=public
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: digital-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digital_learning
      POSTGRES_PASSWORD: digital_learning_dev
      POSTGRES_DB: digital_learning
    ports:
      - "5432:5432"
    volumes:
      - digital_learning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_learning -d digital_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  digital_learning_postgres_data:
